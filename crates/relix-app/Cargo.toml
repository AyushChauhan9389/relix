[package]
name = "relix-app"
version = "0.2.7"
edition.workspace = true
license.workspace = true

[dependencies]
freya-core = "=0.5.2"
futures-util = "0.3.34"
# Google sign-in (drive.rs): PKCE.
base64 = "0.22.1"
getrandom = "0.3.4"
sha2 = "0.11.1"
relix-proto = { version = "0.1.0", path = "../relix-proto" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
url = "2"

# Desktop and Android (the web build, wasm32-unknown-emscripten, uses the browser for these: net.rs, web.rs).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
discord-rich-presence = "1.1.0"
freya = { version = "=0.5.2", features = ["remote-asset", "sdk-tokio", "router", "metrics"] }
freya-skia-safe = { version = "=0.104.0", features = ["gl"] }
gilrs = "0.11.2"
libmpv2 = { version = "6", default-features = false, features = ["render"] }
# Only to pick its crypto provider at start (lib.rs tls_provider).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# The web build: Freya draws into a WebGL canvas; tokio only for its runtime-free parts (channels).
[target.'cfg(target_os = "emscripten")'.dependencies]
freya = { version = "=0.5.2", default-features = false, features = ["web", "remote-asset", "router"] }
tokio = { version = "1.54.1", features = ["sync", "macros"] }

[dev-dependencies]
# Headless runs with touch input, to check how scrolling feels on phones.
freya-testing = "=0.5.2"

[target.'cfg(target_os = "android")'.dependencies]
# Opens links (Intent.ACTION_VIEW); Freya's Android support uses the same version.
jni = "0.22.4"
# Android has no system root store reqwest can read without a Java helper, so HTTPS uses these roots.
webpki-root-certs = "1.0.11"
# Those roots as a PEM file for mpv (player.rs); already in the tree through reqwest.
base64 = "0.22.1"
winit = { version = "0.30.13", features = ["android-native-activity"] }

# libmpv's bundled bindings are for 64-bit; 32-bit ARM (older Android TVs) generates its own.
[target.'cfg(target_arch = "arm")'.dependencies]
libmpv2-sys = { version = "4.0.1", features = ["use-bindgen"] }

[build-dependencies]
winresource = "0.1.34"

# Installers (cargo packager), built by the Release workflow.
[package.metadata.packager]
product-name = "Relix"
identifier = "tech.carbonkit.relix"
publisher = "Relix"
description = "Netflix-style desktop app for Stremio addons"
homepage = "https://relix.carbonkit.tech"
category = "Video"
icons = ["assets/icon.ico", "assets/icon.png"]
binaries-dir = "../../target/release"
out-dir = "../../dist"
binaries = [{ path = "relix-app", main = true }]
# libmpv next to relix-app.exe on Windows (build.rs copies it there); matches nothing on Linux.
resources = ["../../target/release/libmpv-2.dll"]


[package.metadata.packager.nsis]
# Per-user install (no admin), so auto-update can replace the files.
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = ["libmpv2"]
