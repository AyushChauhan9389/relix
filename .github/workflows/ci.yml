name: CI

# Docs, the website and images don't need a build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'public/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'public/**']

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No debug info in test builds: smaller target dirs, faster to cache and restore.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: clippy
      # Lints are the same on both systems; Windows only builds and runs the tests.
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
