# Run by hand (Actions → Release → Run workflow) after bumping version in crates/relix-app/Cargo.toml.
# Builds Windows (setup .exe, .msi, portable .exe, portable .zip) and Linux (.deb, portable .tar.gz),
# makes the GitHub release, and publishes the portable builds for auto-update.
name: Release

on: workflow_dispatch

permissions:
  contents: write

env:
  RELIX_SERVER: https://relix.carbonkit.tech
  # Discord "Now watching"; empty (off) until the repository variable is set.
  RELIX_DISCORD_APP_ID: ${{ vars.RELIX_DISCORD_APP_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version is new
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/relix-app/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump version in crates/relix-app/Cargo.toml."
            exit 1
          fi
          published=$(curl -fsS "$RELIX_SERVER/update/latest?os=windows" | jq -r .version || curl -fsS "$RELIX_SERVER/update/latest" | jq -r .version || true)
          newest=$(printf '%s\n%s\n' "$published" "$version" | sort -V | tail -1)
          if [ -n "$published" ] && { [ "$published" = "$version" ] || [ "$newest" != "$version" ]; }; then
            echo "::error::$version isn't newer than the published $published. Bump version in crates/relix-app/Cargo.toml."
            exit 1
          fi
          echo "Releasing $version (published: ${published:-none})"

  windows:
    needs: check
    runs-on: windows-latest
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      # NSIS and WiX, which cargo-packager downloads on first use.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\.cargo-packager
          key: packager-tools-windows-v1
      - name: Build
        shell: pwsh
        run: |
          $env:RELIX_UPDATE_PUBKEY = (Get-Content packaging/update-key.pub -Raw).Trim()
          cargo build --release -p relix-app
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Portable zip (also the auto-update payload)
        shell: pwsh
        run: |
          $name = "Relix-$env:V-windows-x64-portable"
          New-Item -ItemType Directory -Force $name, dist | Out-Null
          Copy-Item target/release/relix-app.exe, target/release/libmpv-2.dll $name
          Copy-Item packaging/portable-readme.txt "$name/README.txt"
          New-Item -ItemType File "$name/portable" | Out-Null
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
      - name: Portable exe (one file)
        shell: pwsh
        run: |
          $out = "dist/Relix-$env:V-windows-x64-portable.exe"
          $p = Start-Process target/release/relix-app.exe -ArgumentList "--bundle", $out -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "bundling failed" }
      - name: Setup .exe and .msi
        shell: pwsh
        run: |
          cargo packager -p relix-app --release -f nsis,wix
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          Move-Item "dist/relix-app_${env:V}_x64-setup.exe" "dist/Relix-$env:V-windows-x64-setup.exe"
          Move-Item "dist/relix-app_${env:V}_x64_en-US.msi" "dist/Relix-$env:V-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Relix-*.zip
            dist/Relix-*.exe
            dist/Relix-*.msi

  linux:
    needs: check
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Build
        run: |
          export RELIX_UPDATE_PUBKEY=$(tr -d '\r\n' < packaging/update-key.pub)
          cargo build --release -p relix-app -p relix-server
      - name: Portable tar.gz (also the auto-update payload)
        run: |
          name="Relix-$V-linux-x64"
          mkdir -p "$name" dist
          cp target/release/relix-app "$name/"
          cp packaging/linux-readme.txt "$name/README.txt"
          touch "$name/portable"
          tar -czf "dist/$name.tar.gz" "$name"
      - name: Debian package
        run: |
          cargo packager -p relix-app --release -f deb
          mv dist/relix-app_${V}_amd64.deb "dist/Relix-$V-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Relix-*.tar.gz
            dist/Relix-*.deb
      # The publish job signs with relix-server's `update sign`.
      - uses: actions/upload-artifact@v4
        with:
          name: signer
          path: target/release/relix-server

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the commits since the last release.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the auto-update payloads
        env:
          KEY: ${{ secrets.RELIX_UPDATE_SIGNING_KEY }}
        run: |
          chmod +x dist/relix-server
          printf '%s' "$KEY" > signing.key
          trap 'rm -f signing.key' EXIT
          dist/relix-server update sign signing.key "dist/Relix-$VERSION-windows-x64-portable.zip" "$VERSION" > dist/latest-windows.json
          dist/relix-server update sign signing.key "dist/Relix-$VERSION-linux-x64.tar.gz" "$VERSION" > dist/latest-linux.json
          # Builds before per-OS manifests ask for latest.json; it's the Windows one.
          cp dist/latest-windows.json dist/latest.json
      - name: Release notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: bash packaging/release-notes.sh "$VERSION" > notes.md && cat notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/Relix-* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Relix $VERSION" --notes-file notes.md
      - name: Publish for auto-update
        env:
          TOKEN: ${{ secrets.RELIX_ADMIN_TOKEN }}
        run: |
          up() { curl -fsS -X PUT --data-binary "@dist/$1" -H "authorization: Bearer $TOKEN" "$RELIX_SERVER/admin/update/$1"; }
          up "Relix-$VERSION-windows-x64-portable.zip"
          up "Relix-$VERSION-linux-x64.tar.gz"
          # Manifests last, so no client sees a version whose file isn't there yet.
          up latest-windows.json
          up latest-linux.json
          up latest.json
