name: Build setup
description: Rust toolchain plus cached Rust dependencies, libmpv (Windows) and system libraries (Linux).

inputs:
  components:
    description: Extra rustup components, e.g. clippy
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    # Saved only from main, so pull requests reuse it without churning it.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: libmpv cache
      if: runner.os == 'Windows'
      id: mpv
      uses: actions/cache@v6
      with:
        path: vendor/mpv
        key: mpv-${{ hashFiles('packaging/ci/windows-mpv.ps1') }}
    - name: libmpv
      if: runner.os == 'Windows' && steps.mpv.outputs.cache-hit != 'true'
      shell: pwsh
      run: packaging/ci/windows-mpv.ps1

    # libmpv for playback, plus what Freya (Skia, windowing) links.
    - name: System libraries
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: build-essential pkg-config cmake libclang-dev libssl-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libmpv-dev libudev-dev
        version: 1
