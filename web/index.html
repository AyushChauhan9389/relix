<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Relix</title>
  <link rel="icon" href="icon.png">
  <style>
    html, body { margin: 0; height: 100dvh; overflow: hidden; background: #141414; color: #eee; font: 15px system-ui, sans-serif; }
    #canvas { display: block; width: 100dvw; height: 100dvh; outline: none; user-select: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #888; }
    /* The player, drawn like the desktop's (player_ui.rs). */
    #relix-player { position: fixed; inset: 0; background: #000; z-index: 10; color: #fff; --accent: rgb(229, 9, 20); }
    #relix-player video { width: 100%; height: 100%; background: #000; }
    #relix-player.idle { cursor: none; }
    #relix-player .top, #relix-player .bottom, #relix-player .menu { position: absolute; transition: opacity .24s cubic-bezier(.33, 1, .68, 1); }
    #relix-player.idle .top, #relix-player.idle .bottom, #relix-player.idle .menu { opacity: 0; pointer-events: none; }
    #relix-player .top { top: 0; left: 0; right: 0; height: 140px; box-sizing: border-box; padding: 24px 40px 0 32px; display: flex; align-items: flex-start; gap: 16px;
      background: linear-gradient(rgba(0, 0, 0, .8), rgba(0, 0, 0, 0)); }
    #relix-player .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 46px; }
    #relix-player .title { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #relix-player .episode { font-size: 15px; color: rgb(200, 200, 200); }
    #relix-player .episode:empty { display: none; }
    #relix-player .status { align-self: center; font-size: 14px; color: #f88; }
    #relix-player .status a { color: #fff; }
    #relix-player .bottom { bottom: 0; left: 0; right: 0; height: 220px; box-sizing: border-box; padding: 0 40px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
      background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .9)); }
    #relix-player .timeline { display: flex; align-items: center; gap: 16px; }
    #relix-player .left { font-size: 15px; color: rgb(220, 220, 220); font-variant-numeric: tabular-nums; }
    #relix-player .row { display: flex; align-items: center; justify-content: space-between; }
    #relix-player .group { display: flex; align-items: center; gap: 10px; }
    /* Freya's slider: a 6 px track, accent fill, an 18 px light thumb with an accent centre. */
    #relix-player .slider { position: relative; height: 18px; cursor: pointer; touch-action: none; }
    #relix-player .seek { flex: 1; }
    #relix-player .volume { width: 160px; }
    #relix-player .track { position: absolute; left: 0; right: 0; top: 6px; height: 6px; border-radius: 50px; background: rgb(56, 56, 56); overflow: hidden; }
    #relix-player .fill { height: 100%; background: var(--accent); border-radius: 50px; }
    #relix-player .thumb { position: absolute; top: 0; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 4px solid rgb(240, 240, 240); background: var(--accent); }
    /* The round icon button: 8 px around the icon, lightening and growing a little on hover. */
    #relix-player button.icon { position: relative; display: grid; place-items: center; padding: 8px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0);
      color: #fff; cursor: pointer; transition: background .15s, transform .15s; }
    #relix-player button.icon:hover { background: rgba(255, 255, 255, .14); transform: scale(1.1); }
    #relix-player button.icon svg { display: block; }
    #relix-player button.icon b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; pointer-events: none; }
    #relix-player .center { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; }
    #relix-player.paused .center { display: grid; }
    #relix-player .center button { pointer-events: auto; }
    #relix-player .menu { right: 40px; bottom: 110px; display: flex; gap: 24px; padding: 16px; border-radius: 12px; background: rgba(20, 20, 20, .96); border: 1px solid rgba(255, 255, 255, .08); }
    #relix-player .menu[hidden] { display: none; }
    #relix-player .column { width: 300px; display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
    #relix-player .head { font-size: 13px; color: rgb(170, 170, 170); }
    #relix-player .option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: #fff; font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
    #relix-player .option:hover { background: rgba(255, 255, 255, .1); }
    #relix-player .check { width: 18px; height: 18px; }
    #relix-player .spinner { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; box-sizing: border-box;
      border: 4px solid rgba(255, 255, 255, .2); border-top-color: #fff; animation: relix-spin .8s linear infinite; display: none; pointer-events: none; }
    #relix-player.waiting .spinner { display: block; }
    @keyframes relix-spin { to { transform: rotate(360deg); } }
    #relix-player .relix-link { margin-left: 6px; padding: 0; border: 0; background: none; color: #fff; font: inherit; text-decoration: underline; cursor: pointer; }
    /* The Relix Web Helper: the banner on opening the app, and the install steps (src/helper.js). */
    #relix-banner { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 14px;
      max-width: min(940px, calc(100vw - 32px)); box-sizing: border-box; padding: 14px 14px 14px 20px; border-radius: 12px;
      background: rgba(20, 20, 20, .97); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 10px 40px rgba(0, 0, 0, .6); font-size: 14px; line-height: 1.4; }
    #relix-banner span { flex: 1; }
    #relix-banner button, #relix-dialog button { font: inherit; cursor: pointer; }
    #relix-banner .relix-how { padding: 9px 14px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .12); color: #fff; white-space: nowrap; }
    #relix-banner .relix-x { padding: 6px 8px; border: 0; background: none; color: #aaa; font-size: 16px; }
    .relix-primary { padding: 9px 16px; border-radius: 8px; background: rgb(229, 9, 20); color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap; }
    #relix-dialog { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .7); }
    #relix-dialog .relix-card { width: min(560px, 100%); box-sizing: border-box; padding: 28px; border-radius: 14px; background: rgb(24, 24, 24);
      border: 1px solid rgba(255, 255, 255, .1); font-size: 15px; line-height: 1.5; }
    #relix-dialog h2 { margin: 0 0 8px; font-size: 22px; }
    #relix-dialog .relix-why { margin: 0 0 12px; color: #ccc; }
    #relix-dialog ol { margin: 0 0 12px; padding-left: 22px; }
    #relix-dialog li { margin: 6px 0; }
    #relix-dialog code { padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, .1); }
    #relix-dialog a { color: #fff; }
    #relix-dialog .relix-small { color: #999; font-size: 13px; }
    #relix-dialog .relix-warn { color: #f88; }
    #relix-dialog .relix-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    #relix-dialog .relix-secondary { padding: 9px 16px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .12); color: #fff; }
  </style>
</head>
<body>
  <div id="loading">Loading Relix…</div>
  <canvas id="canvas" draggable="false" tabindex="0"></canvas>
  <script type="module" src="app.js"></script>
  <script>
    // Relix's database lives in /data, kept in the browser's storage (IndexedDB): loaded before
    // the app starts, saved every few seconds and when the tab is hidden.
    var Module = {
      canvas: document.getElementById('canvas'),
      preRun: [() => {
        FS.mkdir('/data');
        FS.mount(FS.filesystems.IDBFS, {}, '/data');
        addRunDependency('relix-data');
        FS.syncfs(true, (e) => { if (e) console.error('loading saved data', e); removeRunDependency('relix-data'); });
      }],
      onRuntimeInitialized: () => {
        document.getElementById('loading').remove();
        const save = () => FS.syncfs(false, (e) => e && console.error('saving data', e));
        setInterval(save, 3000);
        document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && save());
      },
    };
  </script>
  <script src="relix-app.js"></script>
</body>
</html>
