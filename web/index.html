<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Relix</title>
  <link rel="icon" href="icon.png">
  <style>
    html, body { margin: 0; height: 100dvh; overflow: hidden; background: #141414; color: #eee; font: 15px system-ui, sans-serif; }
    #canvas { display: block; width: 100dvw; height: 100dvh; outline: none; user-select: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #888; }
    #relix-player { position: fixed; inset: 0; background: #000; z-index: 10; color: #fff; }
    #relix-player video { width: 100%; height: 100%; background: #000; }
    #relix-player.idle { cursor: none; }
    #relix-player .bar, #relix-player .controls { position: absolute; left: 0; right: 0; transition: opacity .25s; }
    #relix-player.idle .bar, #relix-player.idle .controls { opacity: 0; pointer-events: none; }
    #relix-player .bar { top: 0; display: flex; align-items: center; gap: 16px; padding: 24px 40px 48px 32px;
      background: linear-gradient(#000c, #0000); font-size: 22px; font-weight: 700; }
    #relix-player .close { font-size: 34px; line-height: 1; background: none; border: 0; color: #fff; cursor: pointer; }
    #relix-player .status { margin-left: auto; font-size: 14px; font-weight: 400; color: #f88; }
    #relix-player .status a { color: #fff; }
    #relix-player .controls { bottom: 0; padding: 48px 40px 20px; background: linear-gradient(#0000, #000d); }
    #relix-player .seek { position: relative; height: 18px; margin-bottom: 8px; }
    #relix-player .seek > div { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; pointer-events: none; }
    #relix-player .seek::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: #ffffff40; }
    #relix-player .buffered { background: #ffffff70; }
    #relix-player .played { background: #e50914; }
    #relix-player .seek input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
    #relix-player .row { display: flex; align-items: center; gap: 14px; }
    #relix-player .row button { width: 44px; height: 44px; padding: 8px; background: none; border: 0; color: #fff; cursor: pointer; border-radius: 22px; }
    #relix-player .row button:hover { background: #ffffff20; }
    #relix-player .row svg { width: 100%; height: 100%; fill: #fff; }
    #relix-player .row svg text { fill: #fff; font: 700 7px system-ui; }
    #relix-player .volume { width: 110px; accent-color: #e50914; }
    #relix-player .time { margin-left: 6px; font-size: 14px; color: #ddd; font-variant-numeric: tabular-nums; }
    #relix-player .full { margin-left: auto; }
    #relix-player .spinner { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%;
      border: 4px solid #ffffff30; border-top-color: #fff; animation: relix-spin .8s linear infinite; display: none; pointer-events: none; }
    #relix-player.waiting .spinner { display: block; }
    @keyframes relix-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">Loading Relix…</div>
  <canvas id="canvas" draggable="false" tabindex="0"></canvas>
  <script type="module" src="app.js"></script>
  <script>
    // Relix's database lives in /data, kept in the browser's storage (IndexedDB): loaded before
    // the app starts, saved every few seconds and when the tab is hidden.
    var Module = {
      canvas: document.getElementById('canvas'),
      preRun: [() => {
        FS.mkdir('/data');
        FS.mount(FS.filesystems.IDBFS, {}, '/data');
        addRunDependency('relix-data');
        FS.syncfs(true, (e) => { if (e) console.error('loading saved data', e); removeRunDependency('relix-data'); });
      }],
      onRuntimeInitialized: () => {
        document.getElementById('loading').remove();
        const save = () => FS.syncfs(false, (e) => e && console.error('saving data', e));
        setInterval(save, 3000);
        document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && save());
      },
    };
  </script>
  <script src="relix-app.js"></script>
</body>
</html>
